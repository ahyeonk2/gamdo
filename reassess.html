<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GAMDO · 내 기록 기준 업데이트</title><style>body{font:16px system-ui;color:#353831;background:#f7f8f4;max-width:680px;margin:12vh auto;padding:24px}main{background:white;padding:32px;border-radius:24px}button{padding:12px 24px;background:#deebc3;border:0;border-radius:12px;font:inherit}pre{white-space:pre-wrap;font:14px system-ui}</style><main><h1>내 기록 기준 업데이트</h1><p>동일한 기준으로 다시 검토한 파일을 적용합니다. 감상 원문과 꽃의 시드는 보존하고, 이전 분석도 기록에 남깁니다.</p><p><input type="file" id="file" accept="application/json,.json" aria-label="재검토한 분석 파일"></p><button id="apply" disabled>내 꽃에 적용</button><pre id="status" role="status">파일을 선택해 주세요.</pre><a href="/garden">정원으로</a></main><script type="module">let payload;const file=document.querySelector('#file'),apply=document.querySelector('#apply'),status=document.querySelector('#status');file.onchange=async()=>{try{payload=JSON.parse(await file.files[0].text());if(!Array.isArray(payload.records))throw Error();status.textContent=payload.records.length+'개의 꽃을 업데이트할 준비가 됐어요.';apply.disabled=false}catch{status.textContent='올바른 분석 파일을 선택해 주세요.'}};apply.onclick=async()=>{apply.disabled=true;status.textContent='저장 중…';try{const r=await fetch('/api/taste/reassess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error);status.textContent=JSON.stringify(d,null,2)}catch(e){status.textContent=e.message;apply.disabled=false}};</script></html>
